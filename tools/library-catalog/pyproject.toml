[project]
name = "library_catalog"
version = "0.1.0"
description = "Generate the vault library's CATALOG.md from every reference page's frontmatter, and check pages against the page contract."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
library-catalog = "library_catalog.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["library_catalog"]
